<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Web</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    
    <header class="header">
        <nav class="navbar">
        <a href="#Principal" class="nav-link">Principal</a>
        <a href="#Servicios" class="nav-link">Servicios</a>
        <a href="#Acerca de" class="nav-link">Acerca de</a>      
        </nav>
    </header>

    <section id="Principal">Principal</section>
    <section id="Servicios">Servicios</section>
    <section id="Acerca de">Acerca de</section>     
    
    
        <div class="dock">
        <div class="icon"><i class="fab fa-chrome"></i></div>
        <div class="icon"><i class="fab fa-firefox"></i></div>
        <div class="icon"><i class="fab fa-edge"></i></div> 
        <div class="icon"><i class="fab fa-opera"></i></div>
    </div>
</body>

    <form class="login-form">
    <div class="form-heading">Login</div>
    <div class="input-group">
        <label class="label" for="email">Email</label>
        <input
        required=""
        placeholder="Enter your email"
        name="email"
        id="email"
        type="email"
        />
    </div>
    <div class="input-group">
        <label class="label" for="password">Password</label>
        <input
        required=""
        placeholder="Enter your password"
        name="password"
        id="password"
        type="password"
        />
    </div>
    <div class="forgot-password">
        <a href="#">Forgot password?</a>
    </div>
    <button class="submit" type="submit">Log In</button>
    <div class="signup-link">Don't have an account? <a href="#">Sign up</a></div>
    </form>
</html>
